name: "Publish"

on:
  push:
    tags:
      # Publish on any tag starting with the format "YYYY.N.N"
      - "[0-9][0-9][0-9][0-9].[0-9]+.[0-9]+*"

jobs:
  # never publish a release that fails linting, type checking or tests
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    needs: [ci, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build
        run: uv build

      # Check that basic features work and we didn't miss to include crucial files
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl --with pytest pytest -c /dev/null tests/smoke_test.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz --with pytest pytest -c /dev/null tests/smoke_test.py

      - name: Publish
        run: uv publish

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v heading="## [$TAG]" '
            /^## / { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > section.md
          [ -s section.md ] || { echo "No CHANGELOG.md entry for $TAG" >&2; exit 1; }
          {
            echo "# Highlights"
            echo
            awk '/^### / { exit } { print }' section.md | sed -e '/./,$!d'
            echo "## Full Changelog"
            echo
            awk '/^### / { found = 1 } found' section.md
          } > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
